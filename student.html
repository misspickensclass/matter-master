<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import { getDatabase, ref, set, update, onValue, push, remove, get } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";
import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
import { firebaseConfig } from "./firebase-config.js";
import { questions } from "./questions.js";
const app=initializeApp(firebaseConfig); const db=getDatabase(app); const auth=getAuth(app);
await signInAnonymously(auth);
window.MM={db,ref,set,update,onValue,push,remove,get,auth,questions};
</script>
<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Matter Master Student</title><link rel="stylesheet" href="styles.css"></head><body><div class="wrap">
<div class="card"><div class="brand">Grade 8 Physical Science • Unit 1</div><div class="h1">🧪 Matter Master</div><p class="muted">Teacher-Paced Game</p>
<div id="join"><h2>Join Your Teacher's Game</h2><label>Your first name or nickname</label><input id="name" placeholder="e.g., KJ"><label>Room code</label><input id="room" placeholder="ABCD"><button class="btn" id="joinBtn">🚀 Join Game</button><p id="err" class="bad"></p></div>
<div id="game" style="display:none"><div class="stats"><div class="stat"><b id="xp">0</b><span>XP</span></div><div class="stat"><b id="streak">0</b><span>Streak</span></div><div class="stat"><b id="qnum">—</b><span>Question</span></div><div class="stat"><b id="status">WAIT</b><span>Status</span></div></div><br><span class="mission" id="mission">Waiting</span><div class="question" id="q">Your teacher has not started the question yet.</div><div id="choices"></div><div id="paw" style="display:none"><h3>🐾 P-A-W Distractor Analysis</h3><label>What is the question asking you to do?</label><input id="verb" placeholder="classify, explain, compare..."><label>Select a distractor you think is wrong.</label><div id="distractors"></div><label>Why is that distractor wrong?</label><textarea id="why" placeholder="Use evidence and scientific reasoning."></textarea><label>Defend your answer.</label><textarea id="evidence" placeholder="Use evidence from the question, model, or data."></textarea><button class="btn" id="submit">Submit P-A-W</button></div><div id="feedback"></div></div></div></div>
<script type="module">
await new Promise(r=>setTimeout(r,300)); const {db,ref,set,update,onValue,push,auth,questions}=window.MM;
const $=id=>document.getElementById(id); let room="",uid=auth.currentUser.uid,lastIndex=-1;
function showQuestion(s){let q=questions[s.qIndex];$("mission").textContent=q.std+" • "+q.mission+" • Level "+q.level;$("qnum").textContent=(s.qIndex+1)+"/"+questions.length;$("status").textContent=s.live?"LIVE":"WAIT";$("q").textContent=s.live?q.q:"Wait for your teacher to start this question."; if(!s.live){$("choices").innerHTML="";$("paw").style.display="none";return} if(lastIndex!==s.qIndex){lastIndex=s.qIndex;$("choices").innerHTML=q.choices.map((c,i)=>`<label class="choice"><input type="radio" name="ans" value="${i}"> ${String.fromCharCode(65+i)}. ${c}</label>`).join("");$("distractors").innerHTML=q.choices.map((c,i)=>`<label class="choice"><input type="radio" name="dist" value="${i}"> ${String.fromCharCode(65+i)}. ${c}</label>`).join("");$("feedback").innerHTML="";$("paw").style.display="block"} if(s.showResults){let st=s.students?.[uid];$("feedback").innerHTML=st?.correct?'<p class="ok"><b>🎉 Correct!</b> Great evidence-based reasoning.</p>':'<p class="bad"><b>🧠 Recalibrate!</b> Recheck the evidence and distractor analysis. Your teacher will move the class when ready.</p>'}}
$("joinBtn").onclick=async()=>{room=$("room").value.trim().toUpperCase();let name=$("name").value.trim();if(!room||!name){$("err").textContent="Enter your name and room code.";return}let snap=await window.MM.get(ref(db,"rooms/"+room));if(!snap.exists()){$("err").textContent="That room does not exist. Check the code.";return}await set(ref(db,"rooms/"+room+"/students/"+uid),{name,xp:0,streak:0,submitted:false,correct:false});$("join").style.display="none";$("game").style.display="block";onValue(ref(db,"rooms/"+room),s=>showQuestion(s.val()))}
$("submit").onclick=async()=>{let s=await window.MM.get(ref(db,"rooms/"+room)),q=questions[s.val().qIndex],ans=document.querySelector('input[name="ans"]:checked'),dist=document.querySelector('input[name="dist"]:checked'),why=$("why").value.trim(),ev=$("evidence").value.trim(),verb=$("verb").value.trim();if(!ans||!dist||!why||!ev||!verb){$("feedback").innerHTML='<p class="bad"><b>Finish P-A-W first.</b> Choose an answer, hunt a distractor, and defend your reasoning.</p>';return}let correct=+ans.value===q.answer,old=s.val().students[uid]||{xp:0,streak:0};let streak=correct?old.streak+1:0;let gain=correct?(q.level===3?40:q.level===2?30:20)+(why.length>=25&&ev.length>=25?15:0)+(streak>=3?10:0):0;await update(ref(db,"rooms/"+room+"/students/"+uid),{submitted:true,correct,xp:(old.xp||0)+gain,streak});$("feedback").innerHTML='<p>⏳ Answer submitted. Wait for your teacher to reveal class results.</p>'}
</script></body></html>
